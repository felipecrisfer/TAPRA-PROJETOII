name: CI/CD

on:
  push:
    branches: ["main"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version
      - run: python3 -m py_compile function_app.py

      - name: Instalar ferramentas de validação
        run: pip install flake8 black isort

      - name: Linting (flake8)
        run: flake8 . --max-line-length=88

      - name: Formatação (black)
        run: black --check --diff .

      - name: Ordem dos imports (isort)
        run: isort --check-only --diff --profile black .