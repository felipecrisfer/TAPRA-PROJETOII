name: CI/CD

on:
  push:
    branches: ["main"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version
      - run: python3 -m py_compile function_app.py

  deploy:
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_FUNCTIONAPP_NAME: 'nome-da-sua-function-app'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_601131a6-0a83-4c27-9ade-848d19018595 }}
          tenant-id: ${{ secrets.AZURE_TENANT_57fe0ac9-f7f7-4580-8b30-5aa7f0ac8e3b }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_296f3e49-9ac8-48df-8d73-92e587a454ab }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: .
          remote-build: true